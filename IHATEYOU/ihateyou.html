<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IHATEU</title>
<style>
/* Font + Reset + Background + Biến CSS đầy đủ */
:root{
  --paper: #fff;
  --ink: #000;
  --grey: #555;
  --accent: #0066cc;
  --card: #f9f9f9;
  --text: #222;
  --muted: #888;
  --danger: #cc0000;
  --font: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;padding:20px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;background:var(--paper);color:var(--text);font-family:var(--font)}
header{width:100%;max-width:700px;padding:14px 24px;border-bottom:2px solid var(--accent);display:flex;justify-content:space-between;align-items:center}
h1,h2{font-family:Georgia,"Times New Roman",serif}
h1{margin:0;font-size:1.15em;color:var(--accent)}
main{width:100%;max-width:700px;margin:0 auto;padding:20px}

/* Ô nạp payload ở giữa + console */
.center{padding:44px 0 30px;text-align:center}
.center h2{margin:0 0 16px;font-size:1.9em;line-height:1.15}
#exec-form{display:flex;gap:8px}
input,textarea,button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--muted);border-radius:3px;padding:9px 12px}
#exec-input{flex:1;border:2px solid var(--accent);font-family:ui-monospace,Consolas,monospace}
button{cursor:pointer}
button:hover,button.on{border-color:var(--accent);color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#console{margin:12px 0 0;padding:10px 12px;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--card);border-left:4px solid var(--muted);font:.9em ui-monospace,Consolas,monospace;min-height:2.6em}
#console.ok{border-color:var(--accent)}
#console.err{border-color:var(--danger);color:var(--danger)}
</style>
</head>
<body>

  <header>
    <h1 id="site-title">IHATEU</h1>
  </header>

  <main>
    <section class="center">
      <h2 id="hero">Chửi gì chửi đi.</h2>
      <form id="exec-form">
        <input id="exec-input" type="text" placeholder="Nhập câu chửi..." required>
        <button type="submit">do it !</button>
      </form>
      <div id="console">everything's alright~</div>
    </section>
  </main> <!-- ĐÃ THÊM: Đóng thẻ main -->

  <script>
      // ĐÃ SỬA: Lắng nghe sự kiện submit form và gửi dữ liệu tới API /api/rate
      document.getElementById("exec-form").addEventListener("submit", async (e) => {
          e.preventDefault();
          const text = document.getElementById("exec-input").value;
          const consoleDiv = document.getElementById("console");
          
          try {
              const response = await fetch("/api/rate", {
                  method: "POST",
                  headers: {
                      "Content-Type": "application/json"
                  },
                  body: JSON.stringify({ name: text })
              });
              
              const data = await response.json();
              consoleDiv.className = "ok";
              consoleDiv.innerText = `${data.name} (${data.score} điểm): ${data.message}`;
          } catch (error) {
              consoleDiv.className = "err";
              consoleDiv.innerText = "Lỗi kết nối server!";
              console.error("Lỗi:", error);
          }
      });
  </script>
</body>
</html>
